services:
  app:
    image: ghcr.io/theaudacityio/direct-flights:${TAG:-latest}
    container_name: direct-flights
    restart: unless-stopped
    # The privacy page promises request logs live at most 14 days; the app
    # itself logs nothing per request, so this bounds whatever stderr keeps.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:3080:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
