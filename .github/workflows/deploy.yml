name: Deploy

on:
  push:
    branches: [main]
    # Docs and roadmap edits (MISSION/SUCCESS/PLANE/PLANNING, README) must not
    # rebuild and redeploy the live site.
    paths-ignore:
      - '**.md'
  # The monthly data-refresh workflow pushes with GITHUB_TOKEN, and such
  # pushes never trigger push workflows; chain off its completion instead.
  workflow_run:
    workflows: [Data refresh]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy
        required: false
        default: latest

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: theaudacityio/direct-flights

permissions: {}

jobs:
  # Manual dispatch must only deploy from main; a write-authorized user must not
  # control the checked-out ref, compose config, or built image for production.
  guard-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Validate deployment trigger
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          
      - name: Enforce main branch for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Manual dispatch is only allowed from the main branch. Current ref: ${{ github.ref }}"
            exit 1
          fi
          echo "Manual dispatch from main branch confirmed."

  # Broken code must not reach the box: the image only builds after the same
  # gate CI runs (tests + typecheck).
  check:
    needs: guard-ref
    # For workflow_run chaining, deploy only after a SUCCESSFUL data refresh.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "tags=${REGISTRY}/${IMAGE_NAME}:latest,${REGISTRY}/${IMAGE_NAME}:${sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Ad unit ids are public (they ship in the HTML), so they live as
          # repository variables, not secrets. Unset variables build the
          # reserved placeholders, exactly as before.
          build-args: |
            VITE_ADSENSE_SLOT_AIRPORT=${{ vars.ADSENSE_SLOT_AIRPORT }}
            VITE_ADSENSE_SLOT_COUNTRY=${{ vars.ADSENSE_SLOT_COUNTRY }}
            VITE_ADSENSE_SLOT_SIDEBAR=${{ vars.ADSENSE_SLOT_SIDEBAR }}
            VITE_REWARDED_AD_UNIT=${{ vars.REWARDED_AD_UNIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # packages: read lets the box pull the GHCR image with this job's token.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Sync compose config to atlas
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.ATLAS_HOST }}
          username: ${{ secrets.ATLAS_USER }}
          key: ${{ secrets.ATLAS_SSH_KEY }}
          port: 22
          source: "deploy/docker-compose.yml"
          target: /home/miguel/direct-flights
          overwrite: true

      - name: Pull image and restart stack
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          # The box pulls the private GHCR package while the job's ephemeral
          # token is still valid.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'latest' }}
        with:
          host: ${{ secrets.ATLAS_HOST }}
          username: ${{ secrets.ATLAS_USER }}
          key: ${{ secrets.ATLAS_SSH_KEY }}
          port: 22
          envs: GHCR_TOKEN,TAG
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd /home/miguel/direct-flights/deploy
            export TAG
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            sleep 5
            docker compose ps
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3080/" || true)
            echo "port 3080 -> HTTP $code"
