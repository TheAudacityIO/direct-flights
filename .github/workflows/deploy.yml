name: Deploy

on:
  push:
    branches: [main]
    # Docs and roadmap edits (MISSION/SUCCESS/PLANE/PLANNING, README) must not
    # rebuild and redeploy the live site.
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy
        required: false
        default: latest

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: theaudacityio/direct-flights

jobs:
  # Broken code must not reach the box: the image only builds after the same
  # gate CI runs (tests + typecheck).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "tags=${REGISTRY}/${IMAGE_NAME}:latest,${REGISTRY}/${IMAGE_NAME}:${sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Sync compose config to atlas
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ATLAS_HOST }}
          username: ${{ secrets.ATLAS_USER }}
          key: ${{ secrets.ATLAS_SSH_KEY }}
          port: 22
          source: "deploy/docker-compose.yml"
          target: /home/miguel/direct-flights
          overwrite: true

      - name: Pull image and restart stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          # The box pulls the private GHCR package while the job's ephemeral
          # token is still valid.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'latest' }}
        with:
          host: ${{ secrets.ATLAS_HOST }}
          username: ${{ secrets.ATLAS_USER }}
          key: ${{ secrets.ATLAS_SSH_KEY }}
          port: 22
          envs: GHCR_TOKEN,TAG
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd /home/miguel/direct-flights/deploy
            export TAG
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            sleep 5
            docker compose ps
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3080/" || true)
            echo "port 3080 -> HTTP $code"
